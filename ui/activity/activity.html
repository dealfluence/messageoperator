<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Mailroom activity</title>
    <style>
      /*__FONTS__*/

      :root {
        --sand: #e8c0a1;
        --sand-dark: #d4a882;
        --mint: #e6f3f0;
        --mauve: #dacad2;
        --navy: #1a2a2c;
      }

      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        /* body text uses the host's UI font (Anthropic Sans / Segoe UI):
           geometric webfonts like Jost hint poorly at 12-14px on Windows
           and the letters visibly wobble */
        font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
        color: var(--color-text-primary, light-dark(#141413, #faf9f5));
        font-size: var(--font-text-sm-size, 14px);
        line-height: var(--font-text-sm-line-height, 1.4);
        /* never fake a weight we didn't ship — synthetic bold reads as smudge */
        font-synthesis: none;
      }

      /* An opaque panel, not a transparent overlay: Windows Chromium only
         gives text subpixel antialiasing on opaque backgrounds — text over
         transparency renders grayscale and reads as smudged/wobbly. */
      main {
        padding: 12px 14px;
        max-width: 640px;
        background: var(
          --color-background-primary,
          light-dark(#ffffff, #30302e)
        );
        border: var(--border-width-regular, 0.5px) solid
          var(--color-border-tertiary, light-dark(#1f1e1d26, #dedcd126));
        border-radius: var(--border-radius-lg, 10px);
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 24px;
      }

      .logo {
        height: 16px;
        width: auto;
        flex: none;
        color: var(--color-text-primary, light-dark(#1e2028, #faf9f5));
      }

      /* The wordmark carries the brand; the tool call's own description is
         the header line beside it (no static title — it would only repeat
         what the reply already says). */
      #subtitle {
        flex: 1 1 auto;
        min-width: 0;
        margin: 0;
        font-size: var(--font-text-sm-size, 14px);
        color: var(--color-text-secondary, light-dark(#3d3d3a, #c2c0b6));
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ---- progress bar ------------------------------------------- */

      #bar {
        margin: 10px 0 8px;
        height: 4px;
        border-radius: var(--border-radius-full, 9999px);
        background: color-mix(in srgb, var(--sand) 22%, transparent);
        overflow: hidden;
      }

      #fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(to right, var(--sand), var(--sand-dark));
        transition: width 0.35s ease;
      }

      [data-state="connecting"] #fill {
        width: 30%;
        animation: slide 1.4s ease-in-out infinite;
      }

      @keyframes slide {
        0% {
          transform: translateX(-110%);
        }

        100% {
          transform: translateX(380%);
        }
      }

      /* ---- summary card --------------------------------------------- */

      #card {
        margin-top: 8px;
      }

      #detail {
        margin: 0 0 5px;
        font-family: var(--font-mono, ui-monospace, Consolas, monospace);
        font-size: var(--font-text-xs-size, 12px);
        color: var(--color-text-tertiary, light-dark(#73726c, #9c9a92));
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #summary {
        margin: 0 0 6px;
        font-size: var(--font-text-sm-size, 14px);
        color: var(--color-text-secondary, light-dark(#3d3d3a, #c2c0b6));
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chips:empty {
        display: none;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: var(--border-radius-full, 9999px);
        padding: 2.5px 10px;
        font-size: var(--font-text-xs-size, 12px);
        font-weight: 600;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        border: var(--border-width-regular, 0.5px) solid transparent;
      }

      .chip.brand {
        background: color-mix(in srgb, var(--sand) 28%, transparent);
        border-color: color-mix(in srgb, var(--sand-dark) 45%, transparent);
        color: var(--color-text-primary, light-dark(#141413, #faf9f5));
      }

      .chip.sent {
        background: var(
          --color-background-success,
          light-dark(#e9f1dc, #1b4614)
        );
        border-color: var(--color-border-success, light-dark(#437426, #599130));
        color: var(--color-text-success, light-dark(#265b19, #7ab948));
      }

      .chip.simulated {
        background: color-mix(in srgb, var(--mauve) 40%, transparent);
        border-color: color-mix(in srgb, var(--mauve) 70%, transparent);
        color: var(--color-text-primary, light-dark(#141413, #faf9f5));
      }

      .chip.rejected {
        background: var(
          --color-background-danger,
          light-dark(#f7ecec, #602a28)
        );
        border-color: var(--color-border-danger, light-dark(#a73d39, #cd5c58));
        color: var(--color-text-danger, light-dark(#7f2c28, #ee8884));
      }

      .chip.warn {
        background: var(
          --color-background-warning,
          light-dark(#f6eedf, #483a0f)
        );
        border-color: var(--color-border-warning, light-dark(#805c1f, #a87829));
        color: var(--color-text-warning, light-dark(#5a4815, #d1a041));
      }

      .chip.muted {
        background: transparent;
        border-color: var(
          --color-border-tertiary,
          light-dark(#1f1e1d26, #dedcd126)
        );
        color: var(--color-text-tertiary, light-dark(#73726c, #9c9a92));
      }

      button.chip.action {
        background: var(
          --color-background-primary,
          light-dark(#ffffff, #30302e)
        );
        border-color: var(
          --color-border-tertiary,
          light-dark(#1f1e1d26, #dedcd126)
        );
        color: var(--color-text-primary, light-dark(#141413, #faf9f5));
        cursor: pointer;
        font-family: inherit;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }

      button.chip.action:hover {
        background: color-mix(in srgb, var(--sand) 20%, transparent);
        border-color: var(--sand-dark);
      }

      #alerts {
        margin-top: 6px;
      }

      /* ---- state switching ------------------------------------------ */

      [data-state="done"] #bar,
      [data-state="failed"] #bar,
      [data-state="cancelled"] #bar {
        display: none;
      }

      /* with no title line, the summary is the failure indicator — give it
         the same danger tone the rejected chips use so it reads at a glance */
      [data-state="failed"] #summary {
        color: var(--color-text-danger, light-dark(#7f2c28, #ee8884));
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
