name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # one red platform should not hide the state of the other two
      fail-fast: false
      matrix:
        # macOS is the deployment target, Windows and Linux are where the other
        # two secret backends (DPAPI, plain 0600 files) and the path handling
        # live. The suite pins the secret backend to files (test/setup.ts), so
        # no runner writes to a real Keychain or Credential Manager.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (Strict)
        # npm ci fails if package-lock.json is out of sync with package.json
        run: npm ci

      - name: Check Formatting
        # We use --check instead of the format script's --write so CI fails if a dev forgot to format
        # Line endings differ per runner; only check once, on Linux.
        if: runner.os == 'Linux'
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Runs both vitest and the experimental sqlite ingest tests
        run: npm test

      - name: Secret storage against the real OS store
        # The rest of the suite stubs `security` / PowerShell, so this is the
        # only place the real Keychain and DPAPI code paths run. Uses a
        # throwaway service name and cleans up after itself; skipped on Linux,
        # which has no platform store to test.
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          MESSAGEOPERATOR_SECRET_IT: "1"
        run: npx vitest run test/secrets_os.test.ts

      - name: Verify Build
        # Ensures esbuild, asset copying, and manifest generation works
        run: npm run build
